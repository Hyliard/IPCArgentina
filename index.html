<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>IPC Adjustment Tracker</title>

  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <main class="container">
    <header>
    <h1>Calculadora de Ajuste por IPC</h1>
    
    <p>
        Seguimiento de actualizaciones trimestrales con datos oficiales del BCRA
    </p>
    </header>

    <section class="card">
      <h2>Nuevo ajuste</h2>

      <div class="form-group">
        <label for="montoBase">
          Monto vigente
        </label>

        <input
          type="number"
          id="montoBase"
          min="0"
          step="0.01"
          placeholder="Ej: 272798.43"
        />
      </div>

      <div class="form-group">
        <label for="trimestre">
          Trimestre
        </label>

        <select id="trimestre"></select>
      </div>

      <button id="calcularBtn">
        Calcular ajuste
      </button>
    </section>

    <section
      id="resultado"
      class="card hidden"
    >
      <h2>Resultado</h2>

      <div id="detalleMeses"></div>

      <div class="resultado-grid">
        <div>
          <span>Monto anterior</span>

          <strong id="montoAnteriorResultado">
            -
          </strong>
        </div>

        <div>
          <span>IPC acumulado</span>

          <strong id="ipcResultado">
            -
          </strong>
        </div>

        <div>
          <span>Aumento</span>

          <strong id="aumentoResultado">
            -
          </strong>
        </div>

        <div class="nuevo-monto">
          <span>Nuevo monto</span>

          <strong id="nuevoMontoResultado">
            -
          </strong>
        </div>
      </div>

      <button id="guardarBtn">
        Guardar ajuste
      </button>
    </section>

    <section class="card">
      <div class="historial-header">
        <h2>Historial de ajustes</h2>

        <button
          id="borrarHistorialBtn"
          class="secondary"
        >
          Borrar historial
        </button>
      </div>

      <div id="historial">
        <p class="empty">
          Todavía no hay ajustes guardados.
        </p>
      </div>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
